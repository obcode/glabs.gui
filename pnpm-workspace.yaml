# pnpm-Settings (seit pnpm 10/11 nicht mehr im "pnpm"-Feld der package.json).
# Native Postinstall-Builds sind aus Sicherheitsgründen standardmäßig blockiert;
# hier werden die für Vite/Tailwind nötigen Pakete explizit erlaubt.
allowBuilds:
  # false: das Postinstall lädt nur das sentry-cli-Binary, das Source-Maps hochlädt — hier
  # nicht gemacht. GlitchTip nimmt keine Uploads an und käme hinter dem Auth-Proxy auch nicht
  # an abholbare Dateien. @sentry/sveltekit funktioniert vollständig ohne.
  '@sentry/cli': false
  '@tailwindcss/oxide': true
  esbuild: true

# Sicherheits-Overrides für transitive Pakete, die noch kein veröffentlichter Parent behebt.
# Jeder Eintrag nennt seinen Parent; raus, sobald dieser einen behobenen Bereich ausliefert.
overrides:
  # graphql-config (über @graphql-codegen/cli, nur dev) verlangt weiter minimatch ^10. Für
  # GHSA-g3hv-75wg-m249 gibt es keinen 10.x-Fix. graphql-config ruft nur
  # minimatch(path, pattern, { dot: true }) auf, und das bleibt in 11 gleich.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1

# One-line fix for sveltejs/kit#17500: capture_scroll throws when a history entry has no
# record (back/forward into an entry made by an earlier document, an iOS reload), which
# leaves the client router stuck until a reload. Remove once a Kit release contains the
# upstream fix; pnpm refuses to install when the patch no longer applies to a new version.
patchedDependencies:
  '@sveltejs/kit@3.4.0': patches/@sveltejs__kit@3.4.0.patch
