# pnpm-Settings (seit pnpm 10/11 nicht mehr im "pnpm"-Feld der package.json).
# Native Postinstall-Builds sind aus Sicherheitsgründen standardmäßig blockiert;
# hier werden die für Vite/Tailwind nötigen Pakete explizit erlaubt.
allowBuilds:
  # false: das Postinstall lädt nur das sentry-cli-Binary, das Source-Maps hochlädt — hier
  # nicht gemacht. GlitchTip nimmt keine Uploads an und käme hinter dem Auth-Proxy auch nicht
  # an abholbare Dateien. @sentry/sveltekit funktioniert vollständig ohne.
  '@sentry/cli': false
  '@tailwindcss/oxide': true
  esbuild: true

# Sicherheits-Overrides für transitive Pakete, die noch kein veröffentlichter Parent behebt.
# Jeder Eintrag nennt seinen Parent; raus, sobald dieser einen behobenen Bereich ausliefert.
overrides:
  # graphql-config (über @graphql-codegen/cli, nur dev) verlangt weiter minimatch ^10, und die
  # @sentry/sveltekit-10.x-Linie zieht glob 13 → minimatch 10. Für GHSA-g3hv-75wg-m249 gibt es
  # keinen 10.x-Fix. graphql-config ruft nur minimatch(path, pattern, { dot: true }) auf, und
  # das bleibt in 11 gleich.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  # @sentry/bundler-plugins 10.x (über @sentry/sveltekit) verlangt glob ^13; GHSA-3g3m-2fjr-6pw4
  # ist erst in 14.0.2 behoben. Der einzige Aufruf, glob(patterns, { absolute, nodir }), dient
  # dem Source-Map-Upload, den dieses Projekt nicht nutzt. @sentry/sveltekit 11 behöbe das
  # sauber, ersetzt aber sendDefaultPii durch freizügigere dataCollection-Defaults — das ist
  # ein eigener Schritt, kein Dependency-Bump.
  'glob@>=9.0.0 <14.0.2': ^14.0.3
  # @sveltejs/kit 2.x verlangt cookie ^0.6; GHSA-pxg6-pf52-xh8x ist in 0.7.0 behoben, Kit selbst
  # erst mit 3.0 (eigene Migration). 0.7 ändert nur die Prüfung von name/path/domain, parse()
  # und serialize() bleiben gleich.
  'cookie@<0.7.0': ^0.7.2
